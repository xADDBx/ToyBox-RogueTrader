name: Create Release for new Tag

on:
  push:
    tags:
      - '**'

jobs:

  build:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: read

    steps:
    - name: Build
      id: build-action
      uses: xADDBx/BuildOwlcatMod@v3
      with:
        GAME_NAME: RogueTrader
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_NAME: ${{ github.repository_owner }}
        PACKAGE_OWNER: xADDBx

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.zipFile }}
        path: ${{ env.outDir }}

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: ${{ env.zipFilePath }}\*.zip
        name: ${{ env.ZipFile }} built for Rogue Trader ${{ env.gameVersionNum }}${{ env.gameVersionSuffix }}
        body: ${{ github.event.head_commit.message }}
        prerelease: true

    - name: Extract Version from zipFile
      shell: pwsh
      run: |
        $version = ($env:zipFile -split '-')[-1]
        echo "MOD_VERSION=$version" >> $env:GITHUB_ENV

    - name: Create English-only zip for NexusMods
      shell: pwsh
      run: |
        $stage = Join-Path $env:RUNNER_TEMP 'NexusMain'
        Copy-Item -Path $env:outDir -Destination $stage -Recurse
        Get-ChildItem -Path (Join-Path $stage 'Localization') -File | Where-Object { $_.Name -ne 'en_lang.json' } | Remove-Item
        $zip = Join-Path $env:RUNNER_TEMP "$env:zipFile.zip"
        Compress-Archive -Path "$stage\*" -DestinationPath $zip
        echo "NEXUS_ZIP=$zip" >> $env:GITHUB_ENV

    - name: Upload to NexusMods
      uses: Nexus-Mods/upload-action@v1.0.0-beta.10
      with:
        api_key: ${{ secrets.NEXUSMODS_API_KEY }}
        file_id: 7679994
        filename: ${{ env.NEXUS_ZIP }}
        version: ${{ env.MOD_VERSION }}
        display_name: ToyBox 2.0 Beta
        description: |-
          ToyBox 2.0 is a complete rewrite.
          Settings don't map 1:1. On first game start the mod will ask you if you want to import your previous settings on a best effort basis. Restart your game after the settings-import to prevent any issues.
        mod_id: 23141283790849
        update_mod_version: false
        changelog: ${{ github.event.head_commit.message }}
